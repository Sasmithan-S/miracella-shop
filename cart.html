<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>Panier — MIRACELLA</title>
  <link rel="stylesheet" href="assets/style.css" />
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;1,300;1,400&family=Montserrat:wght@300;400;500&display=swap" rel="stylesheet" />
</head>
<body>

  <header class="nav-bar scrolled" id="navbar">
    <div class="nav-left">
      <a href="collection.html">Collection</a>
    </div>
    <a href="index.html" class="nav-logo-link">
      <img src="assets/logo.png" alt="Miracella" class="nav-logo" />
    </a>
    <div class="nav-right">
      <a href="cart.html" class="cart-icon active" id="cartLink">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M6 2L3 6v14a2 2 0 002 2h14a2 2 0 002-2V6l-3-4z"/><line x1="3" y1="6" x2="21" y2="6"/><path d="M16 10a4 4 0 01-8 0"/></svg>
        <span class="cart-count" id="cartCount">0</span>
      </a>
    </div>
  </header>

  <section class="cart-page">
    <div class="cart-header">
      <h1>Mon panier</h1>
      <a href="collection.html" class="back-link">← Continuer mes achats</a>
    </div>
    <div class="cart-layout" id="cartLayout"></div>
    <div class="cart-empty" id="cartEmpty" style="display:none">
      <div class="cart-empty-icon">◇</div>
      <h2>Votre panier est vide</h2>
      <p>Découvrez nos bijoux Made in France.</p>
      <a href="collection.html" class="btn-gold">Explorer la collection</a>
    </div>
  </section>

  <footer class="footer">
    <div class="footer-logo">
      <img src="assets/logo.png" alt="Miracella" />
    </div>
    <div class="footer-links">
      <div>
        <h4>Collection</h4>
        <a href="collection.html">Bagues</a>
        <a href="collection.html">Colliers</a>
      </div>
      <div>
        <h4>Infos</h4>
        <a href="#">Livraison</a>
        <a href="#">Contact</a>
      </div>
      <div>
        <h4>Légal</h4>
        <a href="#">CGV</a>
        <a href="#">Confidentialité</a>
      </div>
    </div>
    <div class="footer-bottom"><p>© 2025 Miracella — Made in France</p></div>
  </footer>

  <script src="assets/main.js"></script>
  <script>
    function renderCart() {
      const cart = getCart();
      const layout = document.getElementById('cartLayout');
      const empty = document.getElementById('cartEmpty');
      if (cart.length === 0) {
        layout.style.display = 'none';
        empty.style.display = 'flex';
        return;
      }
      layout.style.display = 'flex';
      empty.style.display = 'none';

      const subtotal = cart.reduce((s, i) => s + i.price * i.qty, 0);
      const shipping = subtotal >= 80 ? 0 : 4.90;
      const total = subtotal + shipping;

      layout.innerHTML = `
        <div class="cart-items">
          ${cart.map(item => `
            <div class="cart-item">
              <div class="cart-item-img">
                <img src="${item.image}" alt="${item.name}" />
              </div>
              <div class="cart-item-info">
                <span class="cart-item-category">${item.category}</span>
                <h3>${item.name}</h3>
                <p class="cart-item-material">${item.material}</p>
                <div class="cart-item-row">
                  <div class="qty-control">
                    <button onclick="changeQty(${item.id}, -1)">−</button>
                    <span>${item.qty}</span>
                    <button onclick="changeQty(${item.id}, 1)">+</button>
                  </div>
                  <span class="cart-item-price">${(item.price * item.qty).toFixed(2)} €</span>
                  <button class="remove-btn" onclick="removeFromCart(${item.id})">Retirer</button>
                </div>
              </div>
            </div>
          `).join('')}
        </div>
        <div class="cart-summary">
          <h3>Récapitulatif</h3>
          <div class="summary-line"><span>Sous-total</span><span>${subtotal.toFixed(2)} €</span></div>
          <div class="summary-line">
            <span>Livraison</span>
            <span>${shipping === 0 ? '<span class="free">Offerte</span>' : shipping.toFixed(2) + ' €'}</span>
          </div>
          ${shipping > 0 ? `<p class="shipping-notice">Plus que ${(80 - subtotal).toFixed(2)} € pour la livraison offerte</p>` : ''}
          <div class="summary-line total">
            <span>Total</span>
            <span>${total.toFixed(2)} €</span>
          </div>
          <button class="btn-gold checkout-btn" onclick="alert('Paiement non disponible en démo.')">
            Passer commande
          </button>
          <p class="secure-note">🔒 Paiement sécurisé</p>
          <div class="payment-icons">
            <span>Visa</span><span>Mastercard</span><span>PayPal</span>
          </div>
        </div>
      `;
    }

    function changeQty(id, delta) {
      let cart = getCart();
      const idx = cart.findIndex(i => i.id === id);
      if (idx > -1) {
        cart[idx].qty += delta;
        if (cart[idx].qty <= 0) cart.splice(idx, 1);
        saveCart(cart);
        updateCartCount();
        renderCart();
      }
    }
    function removeFromCart(id) {
      let cart = getCart().filter(i => i.id !== id);
      saveCart(cart);
      updateCartCount();
      renderCart();
    }
    renderCart();
  </script>
</body>
</html>
